<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-labelledby="event-flow-title event-flow-desc">
<title id="event-flow-title">From a recorded transaction to its reactions</title>
<desc id="event-flow-desc">Flow diagram: a RecordTransaction command is saved with its outbox row in one database commit; later, a worker passes the event through a dispatcher to analytics, categorization and recurring-detection consumers.</desc>
